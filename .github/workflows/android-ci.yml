name: Android CI

on:
  push:
    branches: [ "main", "rewrite/v2" ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-unit-tests:
    name: Build + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"


      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check Play/AAB signing scaffold
        run: bash scripts/check-release-scaffold.sh

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug

      - name: Run JVM unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn

  instrumented-tests:
    name: Emulator instrumented tests API ${{ matrix.api-level }} (KVM)
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        # API 34 is the previously green baseline. API 36 matches compileSdk /
        # targetSdk 36 (system-images;android-36;google_apis;x86_64 on stable).
        api-level: [ 34, 36 ]
    steps:
      - uses: actions/checkout@v5

      # API-34 userdata needs ~7.4 GB free; API-36 google_apis x86_64 is
      # ~1.9 GB zipped. Drop unused toolchains and preinstalled system images
      # so sdkmanager can install only the matrix API image.
      - name: Free up disk space
        run: |
          echo "Before:"; df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /opt/hostedtoolcache/go \
            /opt/hostedtoolcache/Python /opt/hostedtoolcache/Ruby \
            /usr/local/lib/android/sdk/ndk /usr/local/lib/android/sdk/cmake \
            /usr/local/lib/android/sdk/system-images \
            /usr/local/lib/android/sdk/extras \
            /usr/local/share/powershell /usr/share/swift \
            /usr/local/share/chromium || true
          sudo docker image prune -a -f || true
          echo "After:"; df -h /

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # GitHub-hosted Linux runners expose a working /dev/kvm; grant access to it
      # so the Android emulator can use hardware acceleration.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Warm the Gradle wrapper distribution and build the (app + test) APKs
      # before the emulator step, so a transient services.gradle.org hiccup can't
      # fail the emulator run and the emulator script reuses the cached build.
      - name: Pre-build app + instrumented test APKs
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest

      - name: Run instrumented tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          channel: stable
          force-avd-creation: false
          emulator-boot-timeout: 900
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest

      - name: Upload instrumented test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-reports-api-${{ matrix.api-level }}
          path: |
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
          if-no-files-found: ignore

  signed-aab-smoke:
    name: Signed AAB smoke (throwaway keystore)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check Play/AAB signing scaffold
        run: bash scripts/check-release-scaffold.sh

      - name: Smoke signed AAB with throwaway keystore
        run: bash scripts/smoke-signed-aab.sh

      - name: Upload R8 mapping
        uses: actions/upload-artifact@v4
        with:
          name: release-r8-mapping
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error

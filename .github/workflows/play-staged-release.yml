name: Play staged release

# Builds one production-signed AAB for controlled Google Play promotion.
# This workflow deliberately does NOT auto-promote to Production.
# Configure Play upload separately only after owner approval and Play credentials exist.

on:
  workflow_dispatch:
    inputs:
      track:
        description: "Target release stage"
        required: true
        type: choice
        options:
          - internal
          - beta
          - production
      owner_approved_production:
        description: "Required for production; type APPROVE_PRODUCTION"
        required: false
        type: string

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - name: Enforce production owner approval
        env:
          TRACK: ${{ inputs.track }}
          APPROVAL: ${{ inputs.owner_approved_production }}
        run: |
          if [ "$TRACK" = "production" ] && [ "$APPROVAL" != "APPROVE_PRODUCTION" ]; then
            echo "Production promotion requires explicit owner approval."
            exit 1
          fi

  build-release:
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Require production signing material
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then echo "Missing required secret: $name"; exit 1; fi
          done
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload-keystore.jks"
      - name: Build tested signed AAB
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/upload-keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew :app:testDebugUnitTest :app:bundleRelease :app:assembleRelease
          bash scripts/check-r8-mapping.sh
      - name: Upload immutable promotion artifact
        uses: actions/upload-artifact@v4
        with:
          name: nullkey-${{ inputs.track }}-${{ github.sha }}
          path: |
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
      - name: Promotion handoff
        run: |
          echo "Artifact built for stage: ${{ inputs.track }}"
          echo "Promote this exact tested AAB in Play Console; do not rebuild between Beta and Production."

name: Release (signed)

# Builds a signed AAB + APK. Signing material comes from repository secrets, never
# from the repo. Configure these secrets to enable signing:
#   KEYSTORE_BASE64   - base64 of your upload keystore (.jks):  base64 -w0 upload-keystore.jks
#   KEYSTORE_PASSWORD - keystore store password
#   KEY_ALIAS         - key alias
#   KEY_PASSWORD      - key password
# Without the secrets the job skips signing gracefully (no failure).

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

jobs:
  signed-release:
    name: Build signed AAB + APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check for signing secrets
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No KEYSTORE_BASE64 secret configured; skipping signed release build."
          fi

      - name: Decode keystore
        if: steps.signing.outputs.available == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload-keystore.jks"

      - name: Build signed AAB + APK
        if: steps.signing.outputs.available == 'true'
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/upload-keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:bundleRelease :app:assembleRelease

      - name: Verify APK signature
        if: steps.signing.outputs.available == 'true'
        run: |
          BT="$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* | sort | tail -1)"
          "$BT/apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Upload signed artifacts
        if: steps.signing.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: nullkey-signed-release
          path: |
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
